name: Build docker container

on:
  workflow_dispatch: {}
  push: {}

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dataresearchcenter/ftmq
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags') }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push release
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 only for release tags
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker meta (full)
        id: meta-full
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dataresearchcenter/ftmq
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,prefix=full-
            type=semver,pattern={{version}},prefix=full-
            type=sha,prefix=full-sha-
            type=raw,value=full,enable=${{ startsWith(github.ref, 'refs/tags') }}
      - name: Build and push full release
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          # arm64 only for release tags
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: |
            type=gha
            type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
